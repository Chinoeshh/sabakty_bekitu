<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ой ұшқырлығы – білім шыңы</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf6ff;--card:#fff;--tx:#1b2a41;--p:#3a86ff;--ok:#2ec27e;--no:#ef476f;--gold:#ffb703}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a2c;--card:#1b2940;--tx:#f1f5fb}}
:root[data-theme="dark"]{--bg:#101a2c;--card:#1b2940;--tx:#f1f5fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",Verdana,sans-serif;text-align:center;padding:14px}
h1{margin:6px 0 2px;font-size:clamp(20px,4.5vw,34px)}
h1 span{color:var(--p)}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.pill{background:var(--card);border-radius:20px;padding:6px 16px;font-weight:bold;box-shadow:0 2px 6px #0002}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:760px;margin:0 auto}
.cell{aspect-ratio:1;border:none;border-radius:16px;font-size:clamp(18px,4vw,30px);font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003;transition:transform .15s}
.cell:hover{transform:scale(1.08) rotate(-3deg)}
.cell.ok{background:var(--ok)!important}.cell.no{background:var(--no)!important}
.cell.done{cursor:default;transform:none;opacity:.85}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px}
#m.on{display:flex}
.box{background:var(--card);border-radius:22px;padding:20px;max-width:480px;width:100%;border:5px solid var(--gold)}
.tag{display:inline-block;background:var(--gold);color:#222;border-radius:12px;padding:2px 12px;font-weight:bold}
.q{font-size:clamp(18px,4.5vw,24px);margin:14px 0}
.opt{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:2px solid var(--p);background:transparent;color:var(--tx);font-size:18px;cursor:pointer}
.opt:hover{background:var(--p);color:#fff}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--no);border-color:var(--no);color:#fff}
#msg{font-size:20px;font-weight:bold;min-height:28px}
.go{margin-top:8px;padding:10px 26px;border:none;border-radius:12px;background:var(--p);color:#fff;font-size:17px;cursor:pointer;display:none}
.reset{margin-top:16px;padding:8px 20px;border-radius:12px;border:2px solid var(--p);background:transparent;color:var(--tx);cursor:pointer}
</style>
</head>
<body>
<h1>🏔️ «Ой ұшқырлығы – <span>білім шыңы</span>»</h1>
<div>Ұяшықты ашып, сұраққа жауап бер! Әр дұрыс жауап – 1 ұпай ⭐</div>
<div class="bar"><div class="pill">⭐ Ұпай: <span id="sc">0</span></div><div class="pill">📦 Ашылды: <span id="op">0</span>/30</div></div>
<div class="grid" id="g"></div>
<button class="reset" onclick="init()">🔄 Қайта бастау</button>

<div id="m"><div class="box">
<span class="tag" id="tg"></span>
<div class="q" id="q"></div>
<div id="o"></div>
<div id="msg"></div>
<button class="go" id="go" onclick="closeM()">Жалғастыру ➜</button>
</div></div>

<script>
var Q=[
["Математика","12 × 5 = ?",["50","60","65","70"],1],
["Математика","144 : 12 = ?",["10","11","12","14"],2],
["Қазақстан","Қазақстанның астанасы қай қала?",["Алматы","Астана","Шымкент","Қарағанды"],1],
["Табиғат","Жылда неше мезгіл бар?",["3","4","5","6"],1],
["Мәдениет","Домбырада неше ішек бар?",["2","3","4","5"],0],
["Қазақ тілі","«Үлкен» сөзінің антонимі қайсы?",["Биік","Кең","Кішкентай","Ұзын"],2],
["Табиғат","Қай жануар «шөл кемесі» деп аталады?",["Жылқы","Түйе","Есек","Піл"],1],
["Табиғат","Қайсысы көшіп-қонатын құс?",["Торғай","Қарға","Сауысқан","Тырна"],3],
["Табиғат","Су неше градуста қайнайды?",["0°","50°","100°","150°"],2],
["Математика","Қабырғасы 5 см шаршының периметрі қанша?",["10 см","15 см","20 см","25 см"],2],
["Математика","Үшбұрыштың неше қабырғасы бар?",["2","3","4","5"],1],
["Қазақстан","Қазақстанның ұлттық валютасы қандай?",["Рубль","Доллар","Теңге","Евро"],2],
["Әдебиет","Абай Құнанбайұлы кім болған?",["Суретші","Ғалым","Әнші","Ақын"],3],
["Мәдениет","Қайсысы қазақтың ұлттық ойыны?",["Шахмат","Тоғызқұмалақ","Домино","Лото"],1],
["Мәдениет","Наурыз мейрамы қай күні тойланады?",["1 қаңтар","8 наурыз","22 наурыз","1 мамыр"],2],
["Уақыт","Бір аптада неше күн бар?",["5","6","7","8"],2],
["Уақыт","Бір сағатта неше минут бар?",["30","60","90","100"],1],
["Математика","1 метрде неше сантиметр бар?",["10","50","100","1000"],2],
["Математика","250 + 150 = ?",["300","350","400","450"],2],
["Математика","1000 − 275 = ?",["725","735","825","775"],0],
["Табиғат","Өсімдіктің қай бөлігі топырақтан су сіңіреді?",["Жапырақ","Тамыр","Гүл","Жеміс"],1],
["Ғарыш","Жерді айналатын табиғи серігі қайсы?",["Күн","Марс","Ай","Шолпан"],2],
["Ғарыш","Күн жүйесінде неше планета бар?",["7","8","9","10"],1],
["Табиғат","Қайсысы жыртқыш аң?",["Қоян","Қой","Сиыр","Қасқыр"],3],
["Қазақ тілі","Қазақ алфавитінде неше әріп бар?",["32","36","42","46"],2],
["Қазақ тілі","Қайсысы дауысты дыбыс?",["Б","А","К","Т"],1],
["Мақал","«Білекті бірді жығады, ... мыңды жығады». Жалғасын тап!",["Білімді","Батырды","Күштіні","Жүйрікті"],0],
["Ғарыш","Ғарышқа ұшқан тұңғыш адам кім?",["Нил Армстронг","Юрий Гагарин","Алексей Леонов","Тоқтар Әубәкіров"],1],
["Қазақстан","Тәуелсіздік күні қашан тойланады?",["16 желтоқсан","30 тамыз","7 мамыр","25 қазан"],0],
["Математика","9 × 9 = ?",["72","79","81","91"],2]
];
var cols=["#3a86ff","#8338ec","#ff006e","#fb5607","#06a77d","#e09f00"];
var sc,op,cur,g=document.getElementById("g");
function init(){sc=0;op=0;g.innerHTML="";upd();
Q.forEach(function(_,i){var b=document.createElement("button");b.className="cell";b.textContent=i+1;
b.style.background=cols[i%6];b.onclick=function(){openQ(i,b)};g.appendChild(b)})}
function upd(){document.getElementById("sc").textContent=sc;document.getElementById("op").textContent=op}
function openQ(i,b){if(b.classList.contains("done"))return;cur=b;var d=Q[i];
document.getElementById("tg").textContent="№"+(i+1)+" · "+d[0];
document.getElementById("q").textContent=d[1];
document.getElementById("msg").textContent="";document.getElementById("go").style.display="none";
var o=document.getElementById("o");o.innerHTML="";
d[2].forEach(function(t,k){var x=document.createElement("button");x.className="opt";x.textContent=["А) ","Ә) ","Б) ","В) "][k]+t;
x.onclick=function(){answer(i,k,x)};o.appendChild(x)});
document.getElementById("m").classList.add("on")}
function answer(i,k,x){var all=document.querySelectorAll(".opt"),r=Q[i][3];
all.forEach(function(a){a.onclick=null});all[r].classList.add("ok");
var m=document.getElementById("msg");op++;
if(k===r){sc++;m.textContent="🎉 Дұрыс! Жарайсың!";cur.classList.add("ok")}
else{x.classList.add("no");m.textContent="😊 Қателестің, дұрыс жауап жасыл түсті!";cur.classList.add("no")}
cur.classList.add("done");cur.textContent=k===r?"⭐":"✖";upd();
document.getElementById("go").style.display="inline-block"}
function closeM(){document.getElementById("m").classList.remove("on");
if(op===30){setTimeout(function(){alert("🏆 Сайыс аяқталды! Нәтиже: "+sc+" / 30 ұпай")},200)}}
init();
</script>
</body>
</html>
